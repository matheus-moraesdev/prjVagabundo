<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vagabundo Premium | Curriculo</title>
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/style-curriculo.css">

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<body>
    <header class="cabecalho">
    <img class="logo" src="/img/logo_v2.png" alt="logo2">

    <nav class="menu">
        <a class="menu-link" href="../index.html">Sobre</a>
        <a class="menu-link" href="/pages/ensinamentos.html">Ensinamentos</a>
        <a class="menu-link" href="/pages/cursos.html">Cursos</a>
        <a class="menu-link" href="/pages/curriculo.html">Currículo</a>
    </nav>
    </header>
    <main>
         <section class="curriculo">

        <h1>Se torne um de nós!</h1>

        <p class="subtitulo">
            Candidate-se para fazer parte da nossa equipe de profissionais da vagabundagem!
        </p>

        <form class="formulario">

            <label>Nome completo:</label>
            <input type="text" class="campo" placeholder="Digite seu nome" required>

            <label>Idade:</label>
            <input type="number" placeholder="Digite sua idade" required>

            <label>E-mail:</label>
            <input type="email" class="campo" placeholder="Digite seu e-mail" required>

            <hr>

            <h3>Requisitos da vaga</h3>

            <label>1. Você consegue passar bastante tempo coçando o saco?</label>

            <select class="campo">
                <option>Selecione uma opção</option>
                <option>Sim, sou profissional.</option>
                <option>Estou aprendendo.</option>
                <option>Não, sou muito produtivo.</option>
            </select>

            <label>2. Qual seu nível de preguiça?</label>

            <select class="campo">
                <option>Selecione uma opção</option>
                <option>Iniciante</option>
                <option>Avançado</option>
                <option>Vagabundo</option>
            </select>

            <label>3. Você considera levantar da cama um grande desafio?</label>

            <select class="campo">
                <option>Selecione uma opção</option>
                <option>Sim, diariamente.</option>
                <option>Somente nos dias úteis.</option>
                <option>Não, sou uma pessoa ativa.</option>
            </select>

            <label>4. Por que devemos contratar você?</label>

            <textarea rows="4" placeholder="Conte suas habilidades de vagabundagem..." required></textarea>

            <div class="termos">
                <input type="checkbox" required>
                <label>Declaro que sou oficialmente qualificado para não fazer nada.</label>
            </div>

            
            <button type="submit" class="btn btn-warning w-100">
                Eniviar
            </button>

        </form>

    </section>
    </main>

</body>
</html>
